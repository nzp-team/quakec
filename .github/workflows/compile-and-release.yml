name: Compile QuakeC and Publish Release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Compile-QC:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nzp-team/toolbox:main
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Commit
        env:
          QUAKEC_SHA: ${{ github.sha }}
        run: |
          git -C /workspace/repos/quakec fetch origin main
          git -C /workspace/repos/quakec checkout --detach "$QUAKEC_SHA"
          echo "QuakeC commit: $(git -C /workspace/repos/quakec rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile
        run: /entrypoint.sh build-quakec
      - name: Zip Progs
        run: |
          cd /workspace/repos/quakec/build
          zip -r -j standard-nzp-qc.zip standard/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-nzp-qc
          path: /workspace/repos/quakec/build/standard-nzp-qc.zip
          if-no-files-found: error

  Release:
    needs: Compile-QC
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: standard-nzp-qc
          path: ./build
      - name: Generate Build Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"
      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true
          tag_name: bleeding-edge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: bleeding-edge
          release_name: Automated Release ${{ steps.date.outputs.date }}
          body: |
            This is a **bleeding edge** NZ:P QuakeC release, stability is not guarenteed and you may need to grab an updated asset release if this update depends on new models/textures/etc.

            To install:
            - Grab the .ZIP archive below.
            - Extract the contents of the .ZIP archive to your nzp folder (Example: copy `progs.dat` and `progs.lno` to `PSP/GAME/nzportable/nzp`).
          draft: true
          prerelease: false
      - name: Upload STANDARD QC
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/standard-nzp-qc.zip
          asset_name: standard-nzp-qc.zip
          asset_content_type: application/zip
      - name: Publish Release
        uses: StuYarrow/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
