name: QuakeC Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  resolve-toolbox:
    name: Pull Toolbox
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve Toolbox Image
        id: image
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          toolbox_image=$(sed -nE 's/^[[:space:]]*toolbox_image=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          if [ -n "$toolbox_image" ]; then
            if [[ ! "$toolbox_image" =~ ^ghcr\.io/[A-Za-z0-9-]+/toolbox(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
              echo "Invalid Toolbox image: $toolbox_image" >&2
              exit 1
            fi
            image="$toolbox_image"
          else
            image='ghcr.io/nzp-team/toolbox:main'
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Toolbox Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Compile QuakeC
    needs: resolve-toolbox
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select QuakeC PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/quakec fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/quakec checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/quakec rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/quakec rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          {
            echo "QuakeC PR head: \`$PR_HEAD_SHA\`"
            echo "Tested merge commit: \`$PR_MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile
        run: /entrypoint.sh build-quakec
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quakec-pr
          path: /workspace/repos/quakec/build/standard/*
          if-no-files-found: error

  unit-tests:
    name: Run Unit Tests
    needs: resolve-toolbox
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select QuakeC PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/quakec fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/quakec checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/quakec rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/quakec rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          {
            echo "QuakeC PR head: \`$PR_HEAD_SHA\`"
            echo "Tested merge commit: \`$PR_MERGE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Select dependency overrides
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          set -euo pipefail
          for dependency in vril assets; do
            ref=$(sed -nE "s/^[[:space:]]*${dependency}_ref=([^[:space:]]+)[[:space:]]*$/\1/p" <<< "$PR_BODY" | head -n 1)
            [ -n "$ref" ] || continue
            case "$dependency" in
              vril) repository=vril-engine ;;
              assets) repository=assets ;;
            esac
            directory="/workspace/repos/$repository"
            git -C "$directory" fetch "https://github.com/${PR_HEAD_OWNER}/${repository}.git" "$ref"
            git -C "$directory" checkout --detach FETCH_HEAD
            echo "${repository} override: \`${PR_HEAD_OWNER}/${repository}@$(git -C "$directory" rev-parse HEAD)\` (requested \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$dependency" = vril ]; then
              echo 'VRIL_OVERRIDE=1' >> "$GITHUB_ENV"
            else
              echo 'ASSETS_OVERRIDE=1' >> "$GITHUB_ENV"
            fi
          done
      - name: Run unit tests
        run: /entrypoint.sh test-quakec
